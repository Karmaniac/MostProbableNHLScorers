name: Update picks

on:
  schedule:
    # Times are UTC. 14:00 = 10 AM Eastern (9 AM in winter); 21:00 = 5 PM Eastern (4 PM in winter),
    # the second run catches late scratches before puck drop. GitHub may start these a bit late.
    - cron: "0 14 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["site/index.html", "site/history.html", "tims.py", ".github/workflows/update.yml"]

permissions:
  contents: write # commit the day's data.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: America/Toronto # so "today" means today in Eastern time
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rank everyone playing today
        run: python tims.py --top 25 --json site/data.json --history site/history.csv --results site/results.json

      # Committing the data keeps a daily history and keeps the repo "active",
      # which stops GitHub from switching off the schedule after 60 quiet days.
      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json site/history.csv site/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update picks for $(date +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
