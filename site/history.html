<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2522">
<title>Past Picks</title>
<meta name="description" content="Each day's top 50 picks, the stats behind them, and who actually scored.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Same "Scoreboard" look as index.html. Summary tiles, a predicted-vs-actual table, then one day's picks as a table. */
:root {
  --bg: #1B2522;
  --panel: #26332F;
  --line: #40534D;
  --cream: #FDF1DB;
  --khaki: #CFC49D;
  --muted: #B9B394;
  --sage: #96AB88;
  --clay: #D89684;
  --clay-hi: #E3A592;
  --clay-soft: #46453E;
  --display: "Chakra Petch", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--cream); font-family: var(--body); font-size: 15px; line-height: 1.45; }
:focus-visible { outline: 2px solid var(--clay-hi); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right)); padding-block: max(20px, env(safe-area-inset-top)) max(48px, env(safe-area-inset-bottom)); display: grid; gap: 20px; }
a { color: var(--clay-hi); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand span { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 5.5vw, 26px); line-height: 1; letter-spacing: 0.04em; text-transform: uppercase; }
nav { display: flex; gap: 6px; }
nav a { min-height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 6px; border: 1px solid var(--line); color: var(--cream); text-decoration: none; font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
nav a:hover { background: var(--panel); }
nav a[aria-current="page"] { background: var(--sage); border-color: var(--sage); color: var(--bg); font-weight: 700; }
header.intro { display: grid; gap: 6px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 8vw, 56px); line-height: 0.95; text-transform: uppercase; margin: 0; }
h2 { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; margin: 0; }
.sub { color: var(--khaki); font-size: 14px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.tile b { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile:nth-child(3) b { color: var(--clay-hi); }
.tile span { font-size: 13px; color: var(--khaki); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--khaki); font-weight: 600; background: var(--panel); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
td.l, th.l { text-align: left; }
td.mono { font-family: var(--display); font-size: 13px; color: var(--muted); }
td.name { font-weight: 700; }
tr.yes td { background: var(--clay-soft); }
.hit { font-family: var(--display); font-weight: 700; color: var(--clay-hi); }
.miss { color: var(--muted); }
.cmp { display: grid; gap: 3px; min-width: 120px; }
.cmp i { display: block; height: 6px; border-radius: 3px; }
.cmp .p { background: var(--sage); }
.cmp .a { background: var(--clay); }
.legend { font-size: 13px; color: var(--khaki); display: flex; gap: 14px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--khaki); }
select { font: inherit; font-size: 16px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--cream); }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.stack { display: grid; gap: 20px; }
.stack.tight { gap: 10px; }
[hidden] { display: none !important; }
footer { border-top: 1px solid var(--line); padding-top: 16px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="./" style="color: inherit; text-decoration: none">
      <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><path d="M4 14v8c0 3.3 6.3 6 14 6s14-2.7 14-6v-8" fill="#597B60"/><ellipse cx="18" cy="14" rx="14" ry="6" fill="#96AB88" stroke="#FDF1DB" stroke-width="1.5"/></svg>
      <span>Who scores tonight</span>
    </a>
    <nav aria-label="Pages"><a href="./">Rankings</a><a href="history.html" aria-current="page">Past picks</a></nav>
  </div>
  <header class="intro">
    <h1>Past picks</h1>
    <div class="sub">Each day's top 50 picks and who actually scored. Results are added the next morning.</div>
  </header>

  <div class="empty" id="empty" hidden></div>

  <div id="main" class="stack" hidden>
    <div class="tiles" id="tiles"></div>

    <section class="stack tight">
      <h2>Predicted vs actual</h2>
      <div class="legend"><span><i style="background:var(--sage)"></i>Average predicted chance</span><span><i style="background:var(--clay)"></i>Share who scored</span></div>
      <div class="panel"><table id="calib"></table></div>
    </section>

    <section class="stack tight">
      <h2>By day</h2>
      <div class="bar"><select id="day" aria-label="Choose a day"></select><span id="daySum"></span></div>
      <div class="panel"><table id="picks"></table></div>
    </section>
  </div>

  <footer>Data: <a href="history.csv">history.csv</a>. Shootout goals don't count.</footer>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (x) => `${(x * 100).toFixed(0)}%`;
  const fmtDate = (iso) => new Date(iso + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });

  // Quote-aware CSV parse (Python's csv module quotes fields that contain commas).
  function parseCSV(text) {
    const rows = [];
    let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { f += '"'; i++; }
        else if (c === '"') q = false;
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(f); f = ""; rows.push(row); row = [];
      } else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    const [head, ...body] = rows.filter((r) => r.some(Boolean));
    return body.map((r) => Object.fromEntries(head.map((h, i) => [h, r[i]])));
  }

  function stats(rows) {
    const n = rows.length, hits = rows.filter((r) => r.scored).length;
    return { n, hits, rate: n ? hits / n : 0, pred: n ? rows.reduce((s, r) => s + r.prob, 0) / n : 0 };
  }

  function render(rows) {
    const days = [...new Set(rows.map((r) => r.date))].sort().reverse();
    const all = stats(rows), top10 = stats(rows.filter((r) => r.rank <= 10)), first = stats(rows.filter((r) => r.rank === 1));
    $("tiles").innerHTML = [
      [days.length, "days tracked"],
      [`${all.hits}/${all.n}`, `top-50 picks scored (${pct(all.rate)})`],
      [pct(top10.rate), `top 10 scored (predicted ${pct(top10.pred)})`],
      [`${first.hits}/${first.n}`, "#1 pick scored"],
    ].map(([v, l]) => `<div class="tile"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("");

    const buckets = [[0, 0.2, "Under 20%"], [0.2, 0.3, "20–30%"], [0.3, 0.4, "30–40%"], [0.4, 1.01, "40%+"]];
    const max = Math.max(0.5, ...buckets.map(([lo, hi]) => stats(rows.filter((r) => r.prob >= lo && r.prob < hi)).rate));
    $("calib").innerHTML = `<tr><th class="l">Predicted</th><th>Picks</th><th>Scored</th><th>Avg predicted</th><th>Actual</th><th class="l"></th></tr>` +
      buckets.map(([lo, hi, label]) => {
        const s = stats(rows.filter((r) => r.prob >= lo && r.prob < hi));
        if (!s.n) return "";
        return `<tr><td class="l">${label}</td><td>${s.n}</td><td>${s.hits}</td><td>${pct(s.pred)}</td><td>${pct(s.rate)}</td>
          <td class="l"><div class="cmp"><i class="p" style="width:${(s.pred / max * 100).toFixed(1)}%"></i><i class="a" style="width:${(s.rate / max * 100).toFixed(1)}%"></i></div></td></tr>`;
      }).join("");

    $("day").innerHTML = days.map((d) => `<option value="${d}">${esc(fmtDate(d))}</option>`).join("");
    const showDay = () => {
      const day = rows.filter((r) => r.date === $("day").value).sort((a, b) => a.rank - b.rank);
      const s = stats(day);
      $("daySum").textContent = `${s.hits} of ${s.n} scored · expected ${(s.pred * s.n).toFixed(1)}`;
      $("picks").innerHTML = `<tr><th>#</th><th class="l">Player</th><th class="l">Team</th><th class="l">Opp</th><th>S/GP</th><th>Sh%</th><th class="l">L10</th><th>OppD</th><th>xG</th><th>Chance</th><th>Scored</th></tr>` +
        day.map((r) => `<tr class="${r.scored ? "yes" : ""}">
          <td>${r.rank}</td><td class="l name">${esc(r.name)}${r.flagged ? " ⚠" : ""}</td><td class="l">${esc(r.team)}</td><td class="l">${esc(r.opp)}</td>
          <td>${r.shots_pg.toFixed(2)}</td><td>${(r.sh_pct * 100).toFixed(1)}</td><td class="l mono">${esc(r.l10.replace(" in ", "/"))}</td>
          <td>${r.opp_factor.toFixed(2)}</td><td>${r.xg.toFixed(2)}</td><td>${pct(r.prob)}</td>
          <td>${r.scored ? '<span class="hit">✓ Goal</span>' : '<span class="miss">–</span>'}</td></tr>`).join("");
    };
    $("day").addEventListener("change", showDay);
    showDay();
    $("main").hidden = false;
  }

  fetch("history.csv", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then((text) => {
      const num = ["rank", "shots_pg", "sh_pct", "opp_factor", "xg", "prob"];
      const rows = parseCSV(text).map((r) => {
        num.forEach((k) => { r[k] = parseFloat(r[k]) || 0; });
        return { ...r, l10: r.l10 || "", flagged: r.flagged === "True", scored: r.scored === "1" };
      });
      if (!rows.length) throw new Error("empty");
      render(rows);
    })
    .catch(() => {
      $("empty").textContent = "No results yet. The first day's picks are added the morning after.";
      $("empty").hidden = false;
    });
})();
</script>
</body>
</html>
